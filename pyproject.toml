[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrolines"
version = "0.1.0"
description = "Planejamento agrícola — infraestrutura inicial"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "shapely>=2.1,<3", "pyproj>=3.7,<4"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "fiona>=1.10,<2", "defusedxml>=0.7,<1"]
licensing = ["cryptography==46.0.3", "PyNaCl==1.6.2"]
dev = ["cryptography==46.0.3", "PyNaCl==1.6.2", "defusedxml>=0.7,<1", "fiona>=1.10,<2", "pytest>=8,<9", "ruff>=0.14,<0.15", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["server*", "desktop*", "core*", "exporters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
desktop = ["map_assets/*"]
server = ["license_admin/*"]
