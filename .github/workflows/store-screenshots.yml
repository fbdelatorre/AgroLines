name: Real Windows offline Store screenshots (desktop required)
on:
  push:
    paths: ['scripts/capture_store_windows.py', 'scripts/windows_screen_capture.py', 'scripts/store_demo.py', '.github/workflows/store-screenshots.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: github.ref == 'refs/heads/chore/store-screenshots'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Exact developer runtime (not installing a user MSIX)
        run: |
          python -m venv capture-env
          ./capture-env/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r distribution/windows/requirements.lock
      - name: Synthetic project for manual capture fallback
        run: ./capture-env/Scripts/python.exe -m scripts.store_demo --directory store-demo
      - uses: actions/upload-artifact@v4
        with:
          name: agrolines-synthetic-local-projects
          path: store-demo/
          if-no-files-found: error
      - name: Real input desktop, native screen and offline UI
        id: capture
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: windows
        run: ./capture-env/Scripts/python.exe -m scripts.capture_store_windows --output store-capture --revision ${{ github.sha }} --configure-hosted-display
      - name: Publish bounded readiness evidence in job log
        shell: pwsh
        run: |
          $report = Get-Content store-capture/capture-evidence.json -Raw | ConvertFrom-Json
          Write-Output 'AGROLINES_CAPTURE_EVIDENCE_BEGIN'
          $report | ConvertTo-Json -Depth 8
          Write-Output 'AGROLINES_CAPTURE_EVIDENCE_END'
      - name: No substitute screenshots
        if: steps.capture.outcome != 'success'
        shell: pwsh
        run: Write-Output '::warning::Capturas indisponiveis. Consulte capture-evidence.json; obter em Windows interativo adequado. CI passing is not desktop evidence.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-capture-readiness
          path: |
            store-capture/capture-evidence.json
            store-capture/README.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.capture.outcome == 'success'
        with:
          name: agrolines-offline-real-windows-screenshots-REVIEW-REQUIRED
          path: |
            store-capture/*.png
            store-capture/capture-evidence.json
            store-capture/README.md
          if-no-files-found: error
      - name: Preserve actual PNGs in the screenshot PR branch
        if: steps.capture.outcome == 'success' && github.ref == 'refs/heads/chore/store-screenshots'
        shell: pwsh
        run: |
          git pull --ff-only origin chore/store-screenshots
          if ($LASTEXITCODE) { throw 'Branch changed; no force push permitted.' }
          $destination = "docs/store-screenshots/captures/run-$env:GITHUB_RUN_ID"
          if (Test-Path $destination) { throw 'Do not overwrite an existing capture set.' }
          New-Item $destination -ItemType Directory | Out-Null
          Copy-Item store-capture/*.png,store-capture/capture-evidence.json,store-capture/README.md $destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $destination
          git commit -m "docs: preserve actual Windows screenshot set $env:GITHUB_RUN_ID [skip ci]"
          if ($LASTEXITCODE) { throw 'Screenshot commit failed.' }
          git push origin HEAD:chore/store-screenshots
          if ($LASTEXITCODE) { throw 'Screenshot branch push failed; artifact remains available.' }
