name: Capture existing Windows LGPL evidence (read only, no build)
on:
  push:
    branches: [compliance/windows-lgpl-validation]
    paths: ['.github/workflows/windows-lgpl-evidence.yml']
permissions:
  contents: read
  actions: read
  checks: write # Durable GitHub annotations of the small synthetic JSON reports only.
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the already running experiment (never starts another build)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run watch 38663014621 --exit-status --interval 30
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38663014621
          pattern: lgpl-*-EVIDENCE-ONLY-NOT-FOR-INSTALL
          path: captured
      - name: Record small synthetic JSON results as check annotations
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          reports = list(Path('captured').rglob('results.json'))
          assert len(reports) == 3
          expected = {'qtbase-6.12.0', 'geos-3.11.3', 'geos-3.14.1'}
          for path in reports:
              report = json.loads(path.read_text())
              assert report['component'] in expected
              assert not report['sac_approved'] and not report['legal_approved']
              assert not report['agrolines_recombination_demonstrated']
              message = json.dumps({'results_sha256':hashlib.sha256(path.read_bytes()).hexdigest(), 'report':report}, separators=(',',':'))
              assert len(message) < 60000
              print('::notice title=LGPL-LAB-RESULT::' + message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              expected.remove(report['component'])
          assert not expected
          for path in Path('captured').rglob('lab-security.json'):
              r = json.loads(path.read_text(encoding='utf-8-sig'))
              limited = {'os':r['os'], 'registry_state':r['sac']['registry_state'], 'sac_active_confirmed':r['sac']['active_confirmed'], 'errors':r['sac']['errors'], 'defender':r['defender'], 'physical_win11_approved':False}
              print('::notice title=LGPL-LAB-HOST::' + json.dumps(limited,separators=(',',':')))
      - name: Supplement original patch attribution and license texts
        shell: python
        run: |
          import shutil
          from pathlib import Path
          target = Path('captured/third-party-patch-notices')
          target.mkdir()
          for name in ('GPL-3.0-only.txt','LGPL-3.0-only.txt','LGPL-2.1-only.txt'):
              shutil.copyfile(Path('docs/compliance/notices/reference/third-party-notices/reviewed-texts')/name, target/name)
          shutil.copyfile('docs/compliance/windows-validation/lab-source-headers.json',target/'original-source-copyrights.json')
          (target/'README.txt').write_text('Synthetic consumer code is 0BSD. Third-party Qt/GEOS marker patches retain original applicable LGPL terms/copyrights, not 0BSD. Sources are pinned in each results.json and source header record. This evidence contains no distributed Qt/GEOS binary and is NOT the AgroLines corresponding-source offer or legal approval.\n')
          for file in Path('captured').rglob('*'):
              if file.is_file():
                  assert file.suffix in ('.json','.txt','.patch') or file.name == 'CMakeCache.txt', file
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-lgpl-consolidated-EVIDENCE-NOT-LEGAL-APPROVAL
          path: captured/
          if-no-files-found: error
