name: Privacy policy Pages (manual, reviewed text only)
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Digite PUBLICAR_POLITICA_REVISADA apenas depois da revisão jurídica e operacional
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: privacy-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.acknowledgement == 'PUBLICAR_POLITICA_REVISADA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse unresolved policy and regenerate static HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.render_offline_privacy import render
          source = Path('docs/privacy/offline/politica-privacidade.md').read_text()
          if '[CONFIRMAR:' in source or 'NÃO PUBLICAR' in source:
              raise SystemExit('Política ainda pendente: não publicar.')
          render()
          destination = Path('build/privacy-site')
          destination.mkdir(parents=True)
          destination.joinpath('index.html').write_bytes(Path('docs/privacy/offline/politica-privacidade.html').read_bytes())
          destination.joinpath('.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/privacy-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
