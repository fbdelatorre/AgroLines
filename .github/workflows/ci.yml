name: Qualidade
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,desktop]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Validar sintaxe PowerShell
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/Configure.ps1','scripts/Start-Server.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuração efêmera de teste
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          password = secrets.token_hex(24)
          Path('.env').write_text(
              f'POSTGRES_PASSWORD={password}\n'
              f'AGROLINES_DATABASE_URL=postgresql+psycopg://agrolines:{password}@db:5432/agrolines\n'
          )
          PY
      - name: Build, migração e saúde
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/compose.yaml up -d --wait db
          docker compose --env-file .env -f infra/compose.yaml build api
          docker compose --env-file .env -f infra/compose.yaml run --rm api alembic upgrade 0001
          docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -c "CREATE TABLE preservation_marker (value text); INSERT INTO preservation_marker VALUES ('keep');"
          docker compose --env-file .env -f infra/compose.yaml up --no-build -d --wait
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -Atc 'SELECT value FROM preservation_marker')" = 'keep'
          python scripts/integration_check.py
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as response:
              assert json.load(response) == {'status': 'ok', 'service': 'agrolines', 'version': '0.1.0'}
          PY
          docker compose --env-file .env -f infra/compose.yaml exec -T api alembic upgrade head
          docker compose --env-file .env -f infra/compose.yaml exec -T api alembic check
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -Atc 'SELECT version_num FROM alembic_version')" = '0002'
          docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -c 'SELECT PostGIS_Version();'
      - name: Backup e restauração isolada
        run: |
          set -euo pipefail
          mkdir -p backups
          docker compose --env-file .env -f infra/compose.yaml exec -T db pg_dump -U agrolines -d agrolines -Fc > backups/test.dump
          docker compose --env-file .env -f infra/compose.yaml exec -T db createdb -U agrolines agrolines_restore
          docker compose --env-file .env -f infra/compose.yaml exec -T db pg_restore -U agrolines -d agrolines_restore --exit-on-error < backups/test.dump
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines_restore -Atc 'SELECT version_num FROM alembic_version')" = '0002'
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -Atc 'SELECT count(*) FROM users')" = "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines_restore -Atc 'SELECT count(*) FROM users')"
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines -Atc 'SELECT count(*) FROM credentials')" = "$(docker compose --env-file .env -f infra/compose.yaml exec -T db psql -U agrolines -d agrolines_restore -Atc 'SELECT count(*) FROM credentials')"
      - name: Encerrar serviços
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
