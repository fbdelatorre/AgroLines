name: Read-only compliance evidence from immutable candidate
on:
  workflow_dispatch:
  push:
    branches: [compliance/lgpl-store-dossier]
    paths:
      - .github/workflows/compliance-evidence.yml
      - scripts/compliance_capture.py
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agrolines-signing-validation-NOT-FOR-SUBMISSION
          run-id: 38647878392
          github-token: ${{ github.token }}
          path: reference
      - name: Verify every payload byte; export legal documents and metadata only
        run: >-
          python -m scripts.compliance_capture
          --package reference/dist/msix/AgroLines-1.0.0.0-x64-DIAGNOSTICO-ASSINATURA-PENDENTE.msix
          --evidence reference/evidence
          --output build/compliance-capture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agrolines-reference-compliance-evidence-NO-APPLICATION
          path: build/compliance-capture/
          if-no-files-found: error
