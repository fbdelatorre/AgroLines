name: Windows LGPL synthetic lab (no MSIX or installation)
on:
  push:
    branches: [compliance/windows-lgpl-validation]
    paths: ['tools/windows-lgpl-lab/**', '.github/workflows/windows-lgpl-lab.yml']
permissions:
  contents: read
jobs:
  laboratory:
    strategy:
      fail-fast: false
      matrix:
        component: [qtbase-6.12.0, geos-3.11.3, geos-3.14.1]
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare build tools and baseline regression dependencies
        run: python -m pip install -e ".[dev,desktop]" "pyinstaller==6.22.3" "cmake==4.4.4" "ninja==1.13.2"
      - name: Baseline computational precision (shipped engine, separate from compiled laboratory GEOS)
        run: python -m scripts.precision_report --output baseline-precision.json
      - name: Run original and modified synthetic consumers under MSVC x64
        shell: cmd
        env:
          LAB_COMPONENT: ${{ matrix.component }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          python tools/windows-lgpl-lab/run.py --component %LAB_COMPONENT% --work "%RUNNER_TEMP%\lgpl-lab"
      - name: Parse read-only evidence collector
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/windows-lgpl-lab/Collect-Homologation.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lgpl-${{ matrix.component }}-EVIDENCE-ONLY-NOT-FOR-INSTALL
          path: |
            ${{ runner.temp }}/lgpl-lab/evidence/
            baseline-precision.json
          if-no-files-found: error
