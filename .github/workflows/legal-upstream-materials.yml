name: Public upstream legal materials (read only)
on:
  push:
    branches: [compliance/standalone-legal-materials]
    paths: ['tools/legal-upstream/**', '.github/workflows/legal-upstream-materials.yml']
permissions:
  contents: read
jobs:
  public-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve original public source notices; never execute downloaded code
        run: python tools/legal-upstream/retrieve.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-upstream-license-materials-REVIEW-ONLY
          path: build/legal-upstream/
          if-no-files-found: error
