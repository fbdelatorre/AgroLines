name: Public upstream legal materials (read only)
on:
  push:
    branches: [compliance/standalone-legal-materials]
    paths: ['tools/legal-upstream/**', '.github/workflows/legal-upstream-materials.yml']
permissions:
  contents: read
jobs:
  public-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve original public source notices; never execute downloaded code
        run: python tools/legal-upstream/retrieve.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-upstream-license-materials-REVIEW-ONLY
          path: build/legal-upstream/
          if-no-files-found: error
  publication-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolated audit tool only, never included in application dependencies
        run: |
          python -m venv audit-env
          ./audit-env/bin/python -m pip install --only-binary=:all: pypi-attestations==0.0.30
      - name: Verify official publication identities and exact artifact digests, no signing
        run: |
          export PATH="$GITHUB_WORKSPACE/audit-env/bin:$PATH"
          ./audit-env/bin/python tools/legal-upstream/verify_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-public-pypi-provenance-EVIDENCE-ONLY
          path: |
            build/publication-verification/*.json
            build/publication-verification/*.txt
          if-no-files-found: error
