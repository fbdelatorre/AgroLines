name: Shipped SpatiaLite configuration and Qt resource notices
on:
  push:
    branches: [compliance/standalone-native-validation]
    paths: ['tools/standalone-license-probe/**', '.github/workflows/standalone-license-features.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 38733288326
          name: agrolines-standalone-EXPERIMENTAL-UNSIGNED
          path: baseline
      - run: python tools/standalone-license-probe/run.py --payload baseline/dist/AgroLines --work "${{ runner.temp }}/license-probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shipped-license-configuration-EVIDENCE-ONLY
          path: ${{ runner.temp }}/license-probe/evidence/
          if-no-files-found: error
