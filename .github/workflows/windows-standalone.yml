name: Windows standalone offline experimental
on:
  pull_request:
    paths: ['distribution/**', 'docs/distribution/standalone/**', 'tests/test_standalone.py', 'tests/test_legal_materials.py', 'docs/legal/**', 'tools/legal-native/**', 'scripts/signing_pipeline.py', 'scripts/Observe-NativeModules.ps1', '.github/workflows/windows-standalone.yml']
permissions:
  contents: read
concurrency:
  group: standalone-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  commercial-crypto-preflight:
    if: github.head_ref == 'compliance/commercial-licensing-foundation'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - run: ./distribution/windows/standalone/Assert-Laboratory.ps1
      - name: Verify frozen CFFI dynamic import before the full GIS build
        run: |
          python -m venv build-env
          ./build-env/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r distribution/windows/requirements-commercial.lock
          if ($LASTEXITCODE) { throw 'Locked crypto preflight inputs failed.' }
          ./build-env/Scripts/python.exe -m PyInstaller --onedir --clean --noconfirm --name CryptoVerificationLab --hidden-import _cffi_backend --distpath build/crypto-lab --workpath build/crypto-work tools/licensing-lab/verify_frozen.py
          if ($LASTEXITCODE) { throw 'Synthetic frozen crypto build failed.' }
          New-Item evidence/crypto-preflight -ItemType Directory -Force | Out-Null
          & ./build/crypto-lab/CryptoVerificationLab/CryptoVerificationLab.exe evidence/crypto-preflight/result.json
          if ($LASTEXITCODE) { throw 'Synthetic frozen crypto runtime failed.' }
          Get-Content evidence/crypto-preflight/result.json -Raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-commercial-crypto-EVIDENCE-ONLY
          path: evidence/crypto-preflight/
          if-no-files-found: error
  experimental-build:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Refuse unsigned execution outside the authorized disposable server builder
        run: ./distribution/windows/standalone/Assert-Laboratory.ps1
      - name: Parse maintainer scripts
        run: |
          foreach ($file in (Get-ChildItem distribution/windows -Recurse -Filter '*.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          ./distribution/windows/standalone/Test-SigningDenial.ps1
      - name: Exact approved native wheels, isolated from other builder tools
        run: |
          python -m venv build-env
          ./build-env/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r distribution/windows/requirements.lock
          if ($LASTEXITCODE) { throw 'Locked dependencies failed.' }
          ./build-env/Scripts/python.exe -m pip check
          if ($LASTEXITCODE) { throw 'Dependency consistency failed.' }
          $epoch = git show -s --format=%ct $env:GITHUB_SHA
          if ($LASTEXITCODE -or $epoch -notmatch '^\d+$') { throw 'Source epoch missing.' }
          Add-Content $env:GITHUB_ENV "SOURCE_DATE_EPOCH=$epoch"
          Add-Content $env:GITHUB_ENV 'PYTHONHASHSEED=0'
      - name: Build BSD SZIP-compatible libaec and verify original decoder interoperability
        run: |
          ./distribution/windows/standalone/Build-Libaec.ps1
          ./distribution/windows/standalone/Test-Libaec.ps1
      - name: Prepare version-local third-party source delivery, never publish source archive
        run: |
          ./build-env/Scripts/python.exe -m distribution.source_bundle --cache build/source-cache --output build/source-delivery/AgroLines-Third-Party-Sources.zip
          if ($LASTEXITCODE) { throw 'Source delivery integrity failed.' }
          Copy-Item build/source-delivery/AgroLines-Third-Party-Sources.json evidence/standalone/source-delivery.json
      - name: Build the same two GEOS versions from the delivered pinned source archives
        run: ./distribution/windows/standalone/Build-GeosSources.ps1
      - name: Build standalone offline onedir and verify actual PYZ/external bindings
        run: |
          ./build-env/Scripts/python.exe -m distribution.build --standalone --version 1.0.0.3
          if ($LASTEXITCODE) { throw 'Standalone build failed.' }
      - name: Verify exact legal materials in the built payload (not legal approval)
        run: |
          ./build-env/Scripts/python.exe -m distribution.legal_materials --payload dist/AgroLines --output evidence/standalone/legal-materials.json
          if ($LASTEXITCODE) { throw 'Legal material integrity failed.' }
          Copy-Item dist/AgroLines/legal evidence/standalone/packaged-legal -Recurse
          Copy-Item dist/AgroLines/libaec-provenance.json evidence/standalone/libaec-provenance-staged.json
      - name: Observe normal GUI, WebEngine helper, GIS and offline operation with system-only PATH
        run: |
          ./scripts/Observe-NativeModules.ps1 -Executable dist/AgroLines/AgroLines.exe -OutputDirectory evidence/standalone/loads
          $smoke = Get-Content evidence/standalone/loads/smoke-startup-and-gis-probe.json -Raw | ConvertFrom-Json
          $offline = Get-Content evidence/standalone/loads/offline-import-edit-backup-probe.json -Raw | ConvertFrom-Json
          if (-not $smoke.frozen -or -not $smoke.offline_only -or -not $smoke.checks_passed -or -not $smoke.payload_integrity_verified -or
              @($smoke.precision.checks).Count -ne 22 -or -not $offline.passed -or -not $offline.webengine_ready) { throw 'Frozen standalone functional gate failed.' }
          if ($smoke.package_identity.packaged -or $offline.sac_approved) { throw 'Incorrect standalone acceptance claim.' }
      - name: Prove modified external PySide6 and Shiboken Python packages in isolated frozen copy
        run: ./distribution/windows/standalone/Test-BindingReplacement.ps1 -Payload dist/AgroLines -Copy "${{ runner.temp }}/standalone-binding-lab" -Output evidence/standalone/replacement
      - name: Prepare read-only future signing plan, preserve upstream signatures and exact native hashes
        run: ./distribution/windows/standalone/Prepare-SigningPlan.ps1 -Payload dist/AgroLines -SourceCommit $env:GITHUB_SHA -PythonExecutable ./build-env/Scripts/python.exe
      - name: Prepare signed official Inno compiler; compile installer ONLY, never install AgroLines
        run: |
          ./distribution/windows/standalone/Build-Launcher.ps1
          ./distribution/windows/standalone/Test-Launcher.ps1 -Payload dist/AgroLines -Output evidence/standalone/launcher
          ./distribution/windows/standalone/Prepare-Compiler.ps1 -Directory "${{ runner.temp }}/agrolines-inno"
          $compiler = Join-Path '${{ runner.temp }}' 'agrolines-inno/compiler/ISCC.exe'
          Copy-Item (Join-Path '${{ runner.temp }}' 'agrolines-inno/provenance.json') evidence/standalone/compiler-provenance.json
          ./distribution/windows/Build-Installer.ps1 -Standalone -Experimental -Version 1.0.0.3 -CandidateId ($env:GITHUB_SHA.Substring(0,12)) -Compiler $compiler -PythonExecutable ./build-env/Scripts/python.exe
      - name: Bind experimental installer to source, lock, layout and exact payload
        run: |
          $files = @(Get-ChildItem dist/installers -Filter '*EXPERIMENTAL-UNSIGNED.exe')
          if ($files.Count -ne 1) { throw 'Exactly one experimental installer required.' }
          $file = $files[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($signature.Status -ne 'NotSigned') { throw 'Unexpected signing in unsigned workflow.' }
          $report = @{
            file=$file.Name; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size_bytes=$file.Length
            version='1.0.0.3'; architecture='x64'; profile='standalone-offline'; source_commit=$env:GITHUB_SHA
            source_head_commit='${{ github.event.pull_request.head.sha }}'
            run_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            lock_sha256=(Get-FileHash distribution/windows/requirements.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            payload_manifest_sha256=(Get-FileHash dist/AgroLines/payload-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
            layout_sha256=(Get-FileHash dist/AgroLines/standalone-layout.json -Algorithm SHA256).Hash.ToLowerInvariant()
            signature_status=$signature.Status.ToString(); installer_executed=$false; distribution_approved=$false; sac_approved=$false
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content evidence/standalone/artifact.json -Encoding utf8
          # Keep exact installer identity/hash inspectable through the API/logs too.
          Write-Output ('AGROLINES_STANDALONE_ARTIFACT=' + ($report | ConvertTo-Json -Depth 6 -Compress))
          Add-Content $env:GITHUB_STEP_SUMMARY ('Experimental installer: `' + $file.Name + '`')
          Add-Content $env:GITHUB_STEP_SUMMARY ('SHA-256: `' + $report.sha256 + '`')
          Add-Content $env:GITHUB_STEP_SUMMARY 'UNSIGNED. Build/probes only. No installation, signing, SAC approval, publication or commercial authorization.'
      - name: Build separate experimental commercial profile with public synthetic trust only
        if: github.head_ref == 'compliance/commercial-licensing-foundation'
        run: |
          Copy-Item evidence/qt-minimal/build-inputs.json evidence/standalone/offline-build-inputs.json
          Move-Item dist/AgroLines dist/AgroLines-offline
          ./build-env/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r distribution/windows/requirements-commercial.lock
          if ($LASTEXITCODE) { throw 'Commercial locked dependency installation failed.' }
          ./build-env/Scripts/python.exe -m pip check
          if ($LASTEXITCODE) { throw 'Commercial dependency consistency failed.' }
          ./build-env/Scripts/python.exe -m scripts.prepare_license_lab --output "$env:RUNNER_TEMP/licensing-fixture"
          if ($LASTEXITCODE) { throw 'Synthetic public trust preparation failed.' }
          ./build-env/Scripts/python.exe -m distribution.build --commercial --version 1.0.0.4 --license-origin https://licenses.example.test --public-keys "$env:RUNNER_TEMP/licensing-fixture/public.json" --experimental-licensing
          if ($LASTEXITCODE) { throw 'Separate commercial build failed.' }
          New-Item evidence/commercial -ItemType Directory -Force | Out-Null
          Copy-Item dist/AgroLines/legal evidence/commercial/packaged-legal -Recurse
          Copy-Item dist/AgroLines/standalone-layout.json evidence/commercial/layout.json
          ./build-env/Scripts/python.exe -c "import json; from pathlib import Path; d=json.loads(Path('dist/AgroLines/legal/legal-manifest.json').read_text(encoding='utf-8')); s=[{k:r[k] for k in ('component','version','license_evidence')} for r in d['components']]; print('AGROLINES_COMMERCIAL_COMPONENTS='+json.dumps(s)); print('AGROLINES_SOURCE_DELIVERY_SHA256='+d['source_delivery']['sha256'])"
      - name: Frozen DPAPI, offline GIS, revocation persistence and separate commercial installer (never install)
        if: github.head_ref == 'compliance/commercial-licensing-foundation'
        run: |
          $oldPath=$env:PATH
          try {
            $env:PATH="$env:WINDIR/System32;$env:WINDIR"
            $process=Start-Process dist/AgroLines/AgroLines.exe -ArgumentList @('--licensing-probe', "$env:RUNNER_TEMP/licensing-fixture/fixture.json", 'evidence/commercial/frozen-license.json') -PassThru
            if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id; throw 'Commercial probe timeout.' }
            if ($process.ExitCode -ne 0) {
              if (Test-Path evidence/commercial/frozen-license.json) { Get-Content evidence/commercial/frozen-license.json -Raw }
              throw 'Frozen commercial/DPAPI/GIS probe failed.'
            }
          } finally { $env:PATH=$oldPath }
          $license=Get-Content evidence/commercial/frozen-license.json -Raw | ConvertFrom-Json
          if (-not $license.passed -or -not $license.frozen -or -not $license.dpapi_roundtrip -or $license.sac_approved) { throw 'Invalid commercial proof.' }
          ./distribution/windows/standalone/Test-LicenseConcurrency.ps1 -Executable dist/AgroLines/AgroLines.exe -Fixture "$env:RUNNER_TEMP/licensing-fixture/fixture.json" -Output evidence/commercial/concurrency
          ./distribution/windows/standalone/Test-CommercialBindingReplacement.ps1 -Payload dist/AgroLines -Fixture "$env:RUNNER_TEMP/licensing-fixture/fixture.json" -Copy "$env:RUNNER_TEMP/commercial-binding-copy" -Output evidence/commercial/binding-replacement
          ./distribution/windows/standalone/Prepare-SigningPlan.ps1 -Payload dist/AgroLines -SourceCommit $env:GITHUB_SHA -PythonExecutable ./build-env/Scripts/python.exe -Output evidence/commercial/signing
          $compiler=Join-Path '${{ runner.temp }}' 'agrolines-inno/compiler/ISCC.exe'
          ./distribution/windows/Build-Installer.ps1 -Standalone -Experimental -Version 1.0.0.4 -CandidateId ($env:GITHUB_SHA.Substring(0,12)) -Compiler $compiler -PythonExecutable ./build-env/Scripts/python.exe
          $file=Get-ChildItem dist/installers -Filter '*1.0.0.4*EXPERIMENTAL-UNSIGNED.exe' | Select-Object -First 1
          if (-not $file) { throw 'Missing experimental commercial installer.' }
          $report=@{file=$file.Name;sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant();version='1.0.0.4';profile='commercial-standalone';source_commit=$env:GITHUB_SHA;source_head_commit='${{ github.event.pull_request.head.sha }}';unsigned=$true;installed=$false;distributed=$false;sac_approved=$false;deployed_https_activation_proven=$false}
          $report | ConvertTo-Json | Set-Content evidence/commercial/artifact.json -Encoding utf8
          Write-Output ('AGROLINES_COMMERCIAL_ARTIFACT=' + ($report | ConvertTo-Json -Compress))
          # Explicitly NO installer/runtime/source ZIP upload; evidence only below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !contains(fromJSON('["compliance/standalone-native-validation","compliance/standalone-legal-materials","compliance/commercial-licensing-foundation"]'), github.head_ref)
        with:
          name: agrolines-standalone-EXPERIMENTAL-UNSIGNED
          path: |
            dist/installers/*EXPERIMENTAL-UNSIGNED.exe
            dist/AgroLines/
            evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && contains(fromJSON('["compliance/standalone-native-validation","compliance/standalone-legal-materials","compliance/commercial-licensing-foundation"]'), github.head_ref)
        with:
          name: agrolines-standalone-HOMOLOGATION-EVIDENCE-ONLY
          path: evidence/
          if-no-files-found: error
