<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgroLines · Administração de licenças</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" defer></script><body><main><h1>AgroLines · Licenças</h1><p>Administração restrita. Nenhuma cobrança é realizada nesta área.</p><form id="login"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><label>Código do autenticador<input name="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code"></label><button>Entrar por 10 minutos</button></form><p id="message" role="status"></p><section id="panel" hidden><button id="logout">Sair</button><button id="refresh">Atualizar</button><h2>Usuários</h2><form id="user"><input name="name" placeholder="Nome mínimo necessário" required maxlength="120"><input name="email" type="email" placeholder="E-mail do titular" required><button>Criar usuário</button></form><pre id="users"></pre><h2>Assinatura e duas vagas</h2><form id="subscription"><input name="user_id" placeholder="ID do usuário" required><select name="plan"><option value="monthly">Mensal</option><option value="annual">Anual</option></select><button>Criar assinatura e emitir duas chaves</button></form><p>As chaves são exibidas uma vez. Entregue ao titular por canal seguro. Não há confirmação de pagamento nesta operação.</p><pre id="keys"></pre><div id="subscriptions"></div><h2>Histórico administrativo</h2><pre id="audit"></pre></section></main></body></html>
