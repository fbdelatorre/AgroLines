services:
  db:
    image: ${AGROLINES_POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    environment:
      PGDATA: ${AGROLINES_PGDATA:-/var/lib/postgresql/data}
      POSTGRES_DB: agrolines
      POSTGRES_USER: agrolines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrolines -d agrolines"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      AGROLINES_DATABASE_URL: ${AGROLINES_DATABASE_URL:?Defina a URL no .env local}
      AGROLINES_ACCESS_TTL: ${AGROLINES_ACCESS_TTL:-900}
      AGROLINES_REFRESH_TTL: ${AGROLINES_REFRESH_TTL:-86400}
      AGROLINES_LOGIN_LIMIT: ${AGROLINES_LOGIN_LIMIT:-10}
      AGROLINES_LOGIN_WINDOW: ${AGROLINES_LOGIN_WINDOW:-900}
      AGROLINES_SMTP_HOST: ${AGROLINES_SMTP_HOST:-}
      AGROLINES_SMTP_PORT: ${AGROLINES_SMTP_PORT:-587}
      AGROLINES_SMTP_FROM: ${AGROLINES_SMTP_FROM:-agrolines@example.com}
      AGROLINES_SMTP_USERNAME: ${AGROLINES_SMTP_USERNAME:-}
      AGROLINES_SMTP_PASSWORD: ${AGROLINES_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn server.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
